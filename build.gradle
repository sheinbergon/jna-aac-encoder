plugins {
    id 'java'
    id 'jacoco'
    id 'signing'
    id 'checkstyle'
    id 'java-library'
    id 'maven-publish'
    id "io.morethan.jmhreport" version "0.9.6"
    id "io.github.gradle-nexus.publish-plugin" version "2.0.0"
    id 'io.franzbecker.gradle-lombok' version '6.0.0'
}

ext {
    depVersions = [
            lombok      : '1.18.48',
            jna         : '5.19.1',
            commonsLang3: '3.22.0',
            jakarta     : '3.0.0'
    ]
    testDepVersions = [
            junitPlatform: '6.1.3',
            junit        : '6.1.3'
    ]
    benchmarkDepVersions = [
            commonsIO: '2.22.0',
            jmh      : '1.37'
    ]
    nexus = [
            target  : project.findProperty("nexus.target") ?: System.getenv("NEXUS_TARGET") ?: 'SNAPSHOT',
            username: project.findProperty('nexus.username') ?: System.getenv("NEXUS_USERNAME"),
            password: project.findProperty("nexus.password") ?: System.getenv("NEXUS_PASSWORD"),
    ]
    locking = [
            configurations: [
                    'api',
                    'compileClasspath',
                    'implementation',
                    'runtimeOnly',
                    'runtimeClasspath',
                    'testImplementation',
                    'testRuntimeOnly',
                    'testCompileClasspath',
                    'testRuntimeClasspath',
            ]
    ]
    signing = [
            gpgPrivateKey: project.findProperty("signing.gpg.privateKey") ?: System.getenv("GPG_PRIVATE_KEY"),
            gpgPassphrase: project.findProperty("signing.gpg.passphrase") ?: System.getenv("GPG_PASSPHRASE")
    ]
}

group = 'org.sheinbergon'
// Ensure snapshot versions differ from release ones
version = nexus.target == 'SNAPSHOT' ? '2.1.2-SNAPSHOT' : '2.1.2'

repositories {
    mavenCentral()
}

sourceSets {
    benchmark
}

configurations.configureEach {
    if (name in locking.configurations) {
        resolutionStrategy.activateDependencyLocking()
    }
}

// Refreshes the lockfiles, see settings.gradle for the implied --write-locks
tasks.register('lock') {
    description = 'Resolves and writes dependency lockfiles'
    def lockable = files(configurations.matching { it.canBeResolved && it.name in locking.configurations })
    doLast {
        lockable.files
    }
}

dependencies {
    // JNA
    api "net.java.dev.jna:jna:${depVersions.jna}"

    // Utility
    api "org.apache.commons:commons-lang3:${depVersions.commonsLang3}"
    api "jakarta.annotation:jakarta.annotation-api:${depVersions.jakarta}"

    // Lombok
    compileOnly "org.projectlombok:lombok:${depVersions.lombok}"

    // Junit 5
    testCompileOnly "org.projectlombok:lombok:${depVersions.lombok}"
    testImplementation "org.junit.jupiter:junit-jupiter-api:${testDepVersions.junit}"
    testImplementation "org.junit.jupiter:junit-jupiter-engine:${testDepVersions.junit}"
    testImplementation "org.junit.platform:junit-platform-launcher:${testDepVersions.junitPlatform}"

    // JMH Benchmarking
    benchmarkImplementation project(':')
    benchmarkImplementation "org.openjdk.jmh:jmh-core:${benchmarkDepVersions.jmh}"
    benchmarkAnnotationProcessor "org.openjdk.jmh:jmh-generator-annprocess:${benchmarkDepVersions.jmh}"
    benchmarkImplementation "commons-io:commons-io:${benchmarkDepVersions.commonsIO}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
    withJavadocJar()
}

tasks.named('test', Test) {
    systemProperty 'jna.debug_load', false
    // Set the DLL library path
    systemProperty 'jna.library.path', providers.gradleProperty('libPath').getOrElse(System.getProperty('java.library.path'))

    addTestListener(new TestListener() {
        void beforeSuite(TestDescriptor desc) {}

        void beforeTest(TestDescriptor desc) {}

        void afterTest(TestDescriptor desc, TestResult result) {}

        void afterSuite(TestDescriptor desc, TestResult result) {
            if (!desc.parent) {
                println "Test result: ${result.resultType}"
                println "Test summary: ${result.testCount} tests, " +
                        "${result.successfulTestCount} succeeded, " +
                        "${result.failedTestCount} failed, " +
                        "${result.skippedTestCount} skipped"
            }
        }
    })

    useJUnitPlatform()
    testLogging {
        exceptionFormat = 'full'
        showStandardStreams = true
        events 'passed', 'skipped', 'failed'
    }
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.16'
}

checkstyle {
    toolVersion = '12.3.1'
    configFile = layout.projectDirectory.file('checkstyle.xml').asFile
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        csv.required = false
        html.required = true
    }
}

def benchmarkReportDir = layout.buildDirectory.dir('reports/benchmark')

jmhReport {
    jmhResultPath = benchmarkReportDir.get().file('result.json').asFile
    jmhReportOutput = benchmarkReportDir.get().asFile
}

tasks.register('jmh', JavaExec) {
    description = 'Executing JMH benchmarks'

    def aacEncBin = providers.gradleProperty('aacEncBin').getOrElse('/usr/bin/aac-enc')
    def format = providers.gradleProperty('format').getOrElse('json')
    def resultFile = benchmarkReportDir.get().file("result.${format}").asFile

    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    systemProperty 'benchmark.aac.enc.bin', aacEncBin
    systemProperty 'jna.debug_load', true
    args 'Benchmark.*', '-rf', format, '-rff', resultFile.path

    doFirst {
        assert new File(aacEncBin).exists()
        assert System.getProperty('os.name').toLowerCase().contains('linux')
        resultFile.parentFile.mkdirs()
    }
}

tasks.named('jar', Jar) {
    from(layout.projectDirectory) {
        include 'NOTICE'
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'jna-aac-encoder'
            pom {
                name = project.name
                description = 'AAC encoding capabiltiies for the JVM'
                url = 'https://github.com/sheinbergon/jna-aac-encoder'
                inceptionYear = '2018'

                licenses {
                    license {
                        name = 'Apache License 2.0'
                        url = 'https://github.com/sheinbergon/jna-aac-encoder/blob/master/LICENSE'
                        distribution = 'repo'
                    }
                }

                developers {
                    developer {
                        id = 'sheinbergon'
                        name = 'Idan Sheinberg'
                        email = 'ishinberg0@gmail.com'
                    }
                }
                scm {
                    url = 'https://github.com/sheinbergon/jna-aac-encoder'
                    connection = 'scm:https://github.com/sheinbergon/jna-aac-encoder.git'
                    developerConnection = 'scm:git@github.com:sheinbergon/jna-aac-encoder.git'
                }
            }
        }
    }
    repositories {
        mavenLocal()
    }
}

// Setup signing based on nexus-target
signing {
    required = { nexus.target == 'RELEASE' }
    useInMemoryPgpKeys(signing.gpgPrivateKey, signing.gpgPassphrase)
    sign publishing.publications
}

tasks.named('wrapper', Wrapper) {
    gradleVersion = '9.9.2'
}

nexusPublishing {
    transitionCheckOptions {
        maxRetries = 100
        delayBetween = Duration.ofSeconds(5)
    }
    useStaging = provider { nexus.target == 'RELEASE' }
    repositories {
        sonatype {
            username = nexus.username
            password = nexus.password
            nexusUrl = uri('https://ossrh-staging-api.central.sonatype.com/service/local/')
            snapshotRepositoryUrl = uri('https://central.sonatype.com/repository/maven-snapshots/')
        }
    }
}
