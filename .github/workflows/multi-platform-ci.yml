name: Multi Platform CI

on:
  pull_request_target:
    branches:
      - '*'
  push:
    branches-ignore:
      - main
      - wip*
jobs:
  ci:
    name: run tests, style verification, measure code coverage and publish to nexus staging repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-26.04, windows-2025, macos-15 ]
    env:
      OS: ${{ matrix.os }}
    steps:

      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Java JDK setup
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: 17
          distribution: "zulu"

      - name: Run Tests and upload coverage
        run: ./gradlew clean build check test coveralls
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

      # Publish to the staging repository only once, from the Linux Runner
      - name: Publish to Staging repository
        if: runner.os == 'Linux'
        run: ./gradlew publishToSonatype
        env:
          NEXUS_TARGET: SNAPSHOT
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}