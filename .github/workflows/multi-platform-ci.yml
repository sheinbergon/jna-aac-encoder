name: Multi Platform CI

# A single trigger, so every pull request (fork or not) is built exactly once, without access to secrets for forks
on:
  pull_request:
# A newer push to the same branch (or pull request) cancels the run still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One OS at a time, parallel builds trip Maven Central rate limits (HTTP 429)
      max-parallel: 1
      matrix:
        os: [ ubuntu-26.04, windows-2025, macos-15 ]
    env:
      OS: ${{ matrix.os }}
    steps:

      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Java JDK setup
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: 17
          distribution: "zulu"
          cache: gradle

      # The bundled test libmediainfo.so links against libraries missing from current Ubuntu images
      - name: Install MediaInfo (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mediainfo

      - name: Run Tests
        run: ./gradlew clean build check test

      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: build/reports/jacoco/test/jacocoTestReport.xml
          format: jacoco
          base-path: src/main/java

      # Publish to the staging repository only once, from the Linux Runner. Forks have no access to the secrets
      - name: Publish to Staging repository
        if: runner.os == 'Linux' && github.event.pull_request.head.repo.full_name == github.repository
        run: ./gradlew publishToSonatype
        env:
          NEXUS_TARGET: SNAPSHOT
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}