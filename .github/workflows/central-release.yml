name: Central Release Publication

on:
  workflow_dispatch:

jobs:
  ci:
    name: publish to maven-central
    runs-on: ubuntu-26.04
    steps:

      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Java JDK setup
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: 17
          distribution: "zulu"

      # The bundled test libmediainfo.so links against libraries missing from current Ubuntu images
      - name: Install MediaInfo (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mediainfo

      - name: Run Tests
        run: ./gradlew clean build check test

      - name: Upload coverage
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: build/reports/jacoco/test/jacocoTestReport.xml
          format: jacoco
          base-path: src/main/java

      - name: Publish To Release Repository
        run: ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository
        env:
          NEXUS_TARGET: RELEASE
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
